name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Runner self-hosted aux ressources limitées : on annule les exécutions obsolètes
# d'une même branche pour éviter l'empilement dans la file.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint · Build · Test
    # Runner self-hosted enregistré au niveau du dépôt.
    # Voir Settings > Actions > Runners. Ajoutez un label ici pour cibler une machine
    # précise, p. ex. runs-on: [self-hosted, efoundry].
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build --workspace @event-foundry/contracts
          npm run build --workspace @event-foundry/libraries

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace @event-foundry/backend

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
