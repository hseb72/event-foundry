name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    name: Lint · Build · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build shared packages
        run: |
          npm run build --workspace @event-foundry/contracts
          npm run build --workspace @event-foundry/libraries

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
